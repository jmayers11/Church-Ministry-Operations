<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Church Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f8fafc; color: #1e293b;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px; text-align: center;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 48px 40px;
      box-shadow: 0 4px 32px rgba(0,0,0,.1); max-width: 440px; width: 100%;
    }
    .icon { font-size: 3rem; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 10px; }
    p  { font-size: .9rem; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
    a  { display: inline-flex; align-items: center; gap: 6px; padding: 10px 24px;
         background: #4f6ef7; color: #fff; border-radius: 8px; text-decoration: none;
         font-weight: 600; font-size: .9rem; }
    a:hover { background: #3b56e8; }
    .tip { margin-top: 16px; font-size: .78rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      The Church Dashboard needs a network connection to load. Check your internet
      connection and try again. Any data you've already entered is safely stored
      on your device.
    </p>
    <a href="/" onclick="window.location.reload(); return false;">↻ Try Again</a>
    <div class="tip">Your local data is preserved and will sync when you reconnect.</div>
  </div>
</body>
</html>
